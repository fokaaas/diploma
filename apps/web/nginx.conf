server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path returns index.html so TanStack Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite bundles are immutable — cache them aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry HTML.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
